<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Niranjan Plastic Udyog - Factory Management System for managing daily operations, billing, stock, and customer management.">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Niranjan Plastic Udyog</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='65' font-size='45' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>NP</text></svg>">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  <link rel="stylesheet" href="./css/print.css">

  <style>
    /* Critical inline styles for initial load */
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
      flex-direction: column;
      gap: 16px;
    }
    .app-loading .loading-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #818cf8, #6366f1);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800; color: white;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .app-loading p { color: var(--slate-400); font-size: 0.875rem; }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="app-loading" id="app-loading">
    <div class="loading-logo">NP</div>
    <p>Loading...</p>
  </div>

  <!-- Login Layout (full-screen, separate from app layout) -->
  <div class="login-layout" id="login-layout" style="display:none;">
    <!-- Login content injected by router -->
  </div>

  <!-- App Layout (sidebar + main) -->
  <div class="app-layout" id="app-layout" style="display:none;">

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-logo">NP</div>
          <div class="sidebar-brand-text">
            <h1 data-i18n="app_name">Niranjan Plastic Udyog</h1>
            <p data-i18n="app_tagline">Factory Management System</p>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label" data-i18n="nav_section_main">Main Menu</div>

        <a class="nav-item active" href="#/dashboard" data-route="/dashboard">
          <span class="nav-icon">📊</span>
          <span data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <a class="nav-item" href="#/stock" data-route="/stock">
          <span class="nav-icon">📦</span>
          <span data-i18n="nav_stock">Stock Management</span>
        </a>
        <a class="nav-item" href="#/customers" data-route="/customers">
          <span class="nav-icon">👥</span>
          <span data-i18n="nav_customers">Customers</span>
        </a>
        <a class="nav-item" href="#/transactions" data-route="/transactions">
          <span class="nav-icon">📝</span>
          <span data-i18n="nav_transactions">Transactions</span>
        </a>

        <div id="admin-nav-section">
          <div class="nav-section-label" data-i18n="nav_section_admin">Admin</div>
          <a class="nav-item" href="#/admin/payments" data-route="/admin/payments">
            <span class="nav-icon">💳</span>
            <span data-i18n="nav_admin_payments">Payments</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar">AU</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Admin User</div>
            <div class="sidebar-user-role" id="sidebar-user-role">admin</div>
          </div>
          <button class="btn-logout" id="btn-logout" data-i18n-title="logout">
            <span>⏻</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Offline Banner -->
      <div class="offline-banner" id="offline-banner">
        <span>⚠️</span>
        <span data-i18n="sync_offline">Offline</span>
        <span> — </span>
        <span id="sync-pending-count"></span>
        <button class="btn-sync" id="btn-sync" data-i18n="sync_now">Sync Now</button>
      </div>

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle" id="btn-sidebar-toggle">☰</button>
          <h2 class="topbar-title" id="topbar-title" data-i18n="dashboard_title">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <!-- Sync Status -->
          <div class="sync-status online" id="sync-status">
            <span class="sync-dot"></span>
            <span class="sync-text" data-i18n="sync_online">Online</span>
          </div>
          <!-- Language Toggle -->
          <button class="topbar-btn lang-toggle" id="btn-lang-toggle" title="Switch Language">ने</button>
          <!-- Theme Toggle -->
          <button class="topbar-btn" id="btn-theme-toggle" title="Toggle Theme">🌙</button>
        </div>
      </header>

      <!-- Page Container -->
      <div class="page-container" id="page-container">
        <!-- Page content injected by router -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/toast.js"></script>
  <script src="./js/confirm.js"></script>
  <script src="./js/sync.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/pages/login.js"></script>
  <script src="./js/pages/dashboard.js"></script>
  <script src="./js/pages/stock.js"></script>
  <script src="./js/pages/customers.js"></script>
  <script src="./js/pages/transactions.js"></script>
  <script src="./js/pages/receipt.js"></script>
  <script src="./js/pages/admin-payments.js"></script>
  <script src="./js/app.js"></script>

  <!-- Hide loading screen once app boots -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loading');
        if (loader) loader.style.display = 'none';
      }, 300);
    });
  </script>
</body>
</html>
